# 生产环境 MySQL + Redis
# 使用：docker compose -f deploy/docker-compose.prod.yml up -d
#
# 与根目录 docker-compose.yml 的差异：
# - MySQL 暴露到 3306（而非 3307）
# - 只绑定 127.0.0.1，避免公网直连
# - 密码从宿主环境变量读取，不写死
# - 日志限制大小

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: villa-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?must set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-villa_party}
      MYSQL_USER: ${MYSQL_USER:-villa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?must set MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: villa-redis-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?must set REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
