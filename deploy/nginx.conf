# Villa Party Booking — Nginx 站点配置
# 放置位置：/etc/nginx/sites-available/villa-party
# 启用：ln -sf /etc/nginx/sites-available/villa-party /etc/nginx/sites-enabled/
#
# 注意：
# 1. 把 your-domain.com 换成真实域名
# 2. 把 /opt/villa-party-booking 换成你的实际项目路径
# 3. certbot 自动签证书后会注入 ssl_* 指令

server {
    listen 80;
    server_name your-domain.com;

    # HTTP 自动跳 HTTPS（certbot 配完 SSL 后启用）
    # return 301 https://$host$request_uri;

    # 前台用户端（web）
    root /opt/villa-party-booking/web/dist;
    index index.html;

    client_max_body_size 20M;

    # 管理后台：强制加尾斜杠
    location = /admin {
        return 301 /admin/;
    }
    # ^~ 阻止后面的正则 location 抢占静态资源请求
    location ^~ /admin/ {
        alias /opt/villa-party-booking/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 微信支付回调
    location = /api/payment/notify {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前台 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志
    access_log /var/log/nginx/villa-party.access.log;
    error_log  /var/log/nginx/villa-party.error.log;
}

